<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ถึงพี่เดีย 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ===== สี/ฟอนต์หลัก (แก้ได้) ===== */
:root{
  --ink:#2a1033; --ink2:#4a1a55; --rose:#ff5c8a; --blush:#ffe3ec; --lilac:#b9a4ff; --paper:#fffafc;
  --display:'Mali','Prompt',sans-serif; --body:'Prompt','Mali',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--blush);background:radial-gradient(120% 80% at 50% 0%,var(--ink2),var(--ink) 70%) fixed;line-height:1.8;overflow-x:hidden}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 22px;text-align:center;position:relative}
h2{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,6vw,2.3rem);line-height:1.45;margin-bottom:18px}
#rest{display:none}
#rest.on{display:block;animation:fadein 1s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ปุ่มเพลง */
#music{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:20;border:0;border-radius:999px;padding:10px 16px;font:500 .9rem var(--body);background:var(--blush);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
#yt{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9px;top:-9px}

/* หน้าแรก */
#hero .to{font-family:var(--display);font-size:clamp(2.4rem,11vw,4.4rem);font-weight:700;color:var(--rose);line-height:1.25}
#hero .type{font-family:var(--display);font-size:clamp(1.1rem,4.4vw,1.5rem);min-height:2em;margin-top:8px}
.caret::after{content:"";display:inline-block;width:2px;height:1.1em;background:var(--rose);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.heart{position:absolute;bottom:-40px;color:var(--rose);opacity:0;animation:rise linear infinite;pointer-events:none}
@keyframes rise{0%{transform:translateY(0) scale(.8);opacity:0}15%{opacity:.7}100%{transform:translateY(-105vh) scale(1.3);opacity:0}}

/* หัวใจกลาง: กดค้างเพื่อไปหน้าถัดไป */
#bigHeart{--p:0deg;position:relative;width:min(210px,56vw);aspect-ratio:1;margin:34px 0 14px;border:0;border-radius:50%;cursor:pointer;color:#fff;font-size:min(110px,30vw);line-height:1;
  background:conic-gradient(var(--rose) var(--p),rgba(255,227,236,.18) 0);display:grid;place-items:center;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;animation:beat 1.4s ease-in-out infinite}
#bigHeart::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--ink)}
#bigHeart span{position:relative;color:var(--rose)}
#bigHeart.hold{animation:none;transform:scale(1.08)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.hint{font-size:.95rem;opacity:.8}

/* จดหมาย */
.letter{max-width:30em;text-align:left;font-size:1.05rem;white-space:pre-wrap;min-height:16em;padding:26px 24px;border-radius:18px;background:rgba(255,227,236,.08);border:1px solid rgba(255,227,236,.22)}

/* แกลเลอรี */
.wall{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 28px;margin-top:20px;max-width:980px}
.polaroid{width:min(280px,78vw);background:var(--paper);color:var(--ink);padding:12px 12px 14px;border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.polaroid:nth-child(1){transform:rotate(-3deg)}
.polaroid:nth-child(2){transform:rotate(2.5deg) translateY(14px)}
.polaroid:nth-child(3){transform:rotate(-2deg)}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:2px;background:#000}
.polaroid:nth-child(3) img{filter:brightness(1.7) contrast(.95)} /* รูปมืด: ปรับให้สว่างขึ้น */
.polaroid p{font-family:var(--display);font-size:1rem;margin-top:10px;line-height:1.5}

/* คำถาม */
.btn{border:0;border-radius:999px;padding:14px 30px;font:600 1.05rem var(--display);cursor:pointer;background:var(--rose);color:#fff;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:transparent;color:var(--blush);border:2px solid var(--blush)}
.ask{position:relative;width:min(340px,100%);height:150px;margin-top:20px}
.ask .yes{position:absolute;left:0;top:30px;font-size:1.25rem;padding:16px 38px}
.ask .no{position:absolute;right:0;top:36px;transition:left .25s,top .25s}
#win{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:rgba(42,16,51,.94)}
#win.on{display:flex}
#win .big{font-size:5rem;animation:pop .8s ease-out}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.burst{position:fixed;z-index:40;pointer-events:none;font-size:1.6rem;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.fallback{margin-top:22px;font-size:.85rem;opacity:.65}
.fallback a{color:var(--lilac)}
@media (prefers-reduced-motion:reduce){.heart,.caret::after,#bigHeart,#win .big,#rest.on{animation:none}.burst{animation-duration:.01s}html{scroll-behavior:auto}}
</style>
</head>
<body>

<button id="music" type="button" aria-label="เปิดหรือปิดเพลง">🎵 เปิดเพลง</button>
<iframe id="yt" title="เพลงประกอบ" allow="autoplay; encrypted-media"></iframe>

<!-- หน้าแรก -->
<section id="hero">
  <div class="to" id="toName"></div>
  <div class="type caret" id="heroType"></div>
  <button id="bigHeart" type="button" aria-label="กดค้างที่หัวใจเพื่อไปต่อ"><span>♥</span></button>
  <div class="hint">กดค้างที่หัวใจเพื่อไปต่อ</div>
</section>

<!-- หน้าถัดไป (ซ่อนไว้จนกว่าจะกดค้างสำเร็จ) -->
<div id="rest">
  <section id="letterSec">
    <h2>ข้อความถึงพี่เดีย</h2>
    <div class="letter caret" id="letter"></div>
  </section>

  <section id="gallery">
    <h2>คนสวยของเค้า</h2>
    <div class="wall" id="wall"></div>
  </section>

  <section id="ask">
    <h2 id="askQ"></h2>
    <div class="ask" id="askBox">
      <button class="btn yes" id="yes" type="button">รักก 💖</button>
      <button class="btn ghost no" id="no" type="button">ไม่รักล่ะ</button>
    </div>
    <p class="fallback">เพลงไม่ดัง? <a href="https://youtu.be/cAaPHNeLTM4?t=80" target="_blank" rel="noopener">เปิดเพลงบน YouTube</a></p>
  </section>
</div>

<div id="win" role="dialog" aria-live="polite">
  <div class="big">💞</div>
  <h2 id="winT"></h2>
  <p id="winP"></p>
</div>

const $ = id => document.getElementById(id);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

$('toName').textContent = "ถึง " + HER;
$('askQ').textContent = QUESTION;
$('winT').textContent = WIN_T;
$('winP').textContent = WIN_P;

/* แกลเลอรี */
IMGS.forEach(src => {
  const f = document.createElement('figure');
  f.className = 'polaroid';
  f.innerHTML = '<img loading="lazy"><p></p>';
  f.querySelector('img').src = src;
  f.querySelector('img').alt = CAPTION;
  f.querySelector('p').textContent = CAPTION;
  $('wall').appendChild(f);
});

/* พิมพ์ทีละตัวอักษร */
function typeInto(el, text, speed, done){
  const chars = Array.from(text);   // รองรับอีโมจิ
  if (calm){ el.textContent = text; el.classList.remove('caret'); done && done(); return; }
  let i = 0; el.textContent = "";
  const t = setInterval(() => {
    el.textContent = chars.slice(0, ++i).join("");
    if (i >= chars.length){ clearInterval(t); done && done(); }
  }, speed);
}
typeInto($('heroType'), "มีอะไรจะบอกนะ...", 90, () => $('heroType').classList.remove('caret'));

/* หัวใจลอย */
if (!calm){
  for (let i = 0; i < 16; i++){
    const h = document.createElement('span');
    h.className = 'heart'; h.textContent = '♥';
    h.style.left = Math.random() * 100 + '%';
    h.style.fontSize = 14 + Math.random() * 22 + 'px';
    h.style.animationDuration = 7 + Math.random() * 7 + 's';
    h.style.animationDelay = Math.random() * 8 + 's';
    $('hero').appendChild(h);
  }
}

/* เพลง YouTube (เริ่มที่ 1:20 และวนกลับมาที่ 1:20) */
const yt = $('yt'), mb = $('music');
let started = false, playing = false;
function cmd(fn, args){
  yt.contentWindow && yt.contentWindow.postMessage(JSON.stringify({event:'command', func:fn, args:args || []}), '*');
}
yt.addEventListener('load', () => {
  yt.contentWindow.postMessage(JSON.stringify({event:'listening', id:1}), '*');
});
addEventListener('message', e => {
  if (typeof e.data !== 'string' || e.data.indexOf('youtube') < 0) return;
  try {
    const d = JSON.parse(e.data);
    const st = d.event === 'onStateChange' ? d.info : (d.info && d.info.playerState);
    if (st === 0){ cmd('seekTo', [SONG_START, true]); cmd('playVideo'); }   // จบเพลง -> กลับไป 1:20
  } catch (_) {}
});
function startMusic(){
  if (started) return;
  started = true; playing = true;
  yt.src = `https://www.youtube.com/embed/${SONG_ID}?autoplay=1&start=${SONG_START}&enablejsapi=1&playsinline=1`;
  mb.textContent = '🔊 ปิดเพลง';
}
mb.addEventListener('click', () => {
  if (!started){ startMusic(); return; }
  playing = !playing; cmd(playing ? 'playVideo' : 'pauseVideo');
  mb.textContent = playing ? '🔊 ปิดเพลง' : '🎵 เปิดเพลง';
});

/* กดค้างที่หัวใจ -> ไปหน้าถัดไป */
const heart = $('bigHeart');
let t0 = 0, raf = 0, opened = false;
function step(now){
  const p = Math.min(1, (now - t0) / HOLD_MS);
  heart.style.setProperty('--p', p * 360 + 'deg');
  if (p >= 1){ openNext(); return; }
  raf = requestAnimationFrame(step);
}
function holdStart(e){
  if (opened) return;
  e.preventDefault();
  startMusic();                       // การกดครั้งแรกคือสิ่งที่ทำให้เบราว์เซอร์ยอมเล่นเสียง
  heart.classList.add('hold');
  t0 = performance.now(); raf = requestAnimationFrame(step);
}
function holdEnd(){
  if (opened) return;
  cancelAnimationFrame(raf);
  heart.classList.remove('hold');
  heart.style.setProperty('--p', '0deg');
  if (started && playing) cmd('playVideo');
}
heart.addEventListener('pointerdown', holdStart);
['pointerup','pointercancel','pointerleave'].forEach(n => heart.addEventListener(n, holdEnd));
heart.addEventListener('contextmenu', e => e.preventDefault());
heart.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) holdStart(e); });
heart.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') holdEnd(); });

function burst(x, y, n){
  const set = ['💖','💕','💗','💘','✨','🌸'];
  for (let i = 0; i < n; i++){
    const b = document.createElement('span');
    b.className = 'burst'; b.textContent = set[i % set.length];
    b.style.left = x + 'px'; b.style.top = y + 'px';
    const a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 180;
    b.style.setProperty('--x', Math.cos(a) * r + 'px');
    b.style.setProperty('--y', Math.sin(a) * r - 60 + 'px');
    b.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg');
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1700);
  }
}

function openNext(){
  opened = true;
  const r = heart.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 24);
  setTimeout(() => {
    $('hero').style.display = 'none';
    $('rest').classList.add('on');
    scrollTo(0, 0);
    typeInto($('letter'), LETTER, 55, () => $('letter').classList.remove('caret'));   // เริ่มพิมพ์ข้อความ
  }, 600);
}

/* ปุ่ม "ไม่รักล่ะ" วิ่งหนี */
const box = $('askBox'), no = $('no');
function dodge(e){
  e.preventDefault();
  const b = box.getBoundingClientRect();
  no.style.left = Math.random() * (b.width - no.offsetWidth) + 'px';
  no.style.top = Math.random() * (b.height - no.offsetHeight) + 'px';
  no.style.right = 'auto';
}
no.addEventListener('pointerenter', dodge);
no.addEventListener('pointerdown', dodge);
no.addEventListener('click', dodge);
$('yes').addEventListener('click', () => {
  $('win').classList.add('on');
  burst(innerWidth / 2, innerHeight / 2, 40);
  setTimeout(() => burst(innerWidth / 2, innerHeight / 2, 40), 500);
});
</script>
